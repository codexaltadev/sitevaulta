; SiteVaulta — extra worker server. Runs uptime checks and backups so the web server only serves pages.
;
; Requirements on this server:
;   - the same code and .env as the web server (same APP_KEY, DB_*, REDIS_*/CACHE_STORE, QUEUE_CONNECTION)
;   - private network / VPN access to the database (and Redis); never expose MySQL to the internet
;   - CACHE_STORE=database or redis (shared), so locks and unique jobs work across servers
;
; Add more of these servers to add capacity; numprocs = parallel checks / backups per server.

[program:sitevaulta-monitor-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/Project/website-backup/artisan queue:work --queue=monitoring --sleep=1 --max-time=3600 --timeout=400
directory=/home/Project/website-backup
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=milton
numprocs=8
redirect_stderr=true
stdout_logfile=/home/Project/website-backup/storage/logs/supervisor-monitor-worker.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=420

[program:sitevaulta-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/Project/website-backup/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=7200
directory=/home/Project/website-backup
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=milton
numprocs=2
redirect_stderr=true
stdout_logfile=/home/Project/website-backup/storage/logs/supervisor-queue-worker.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=3600

; Optional second scheduler: every task is guarded by onOneServer, so it never runs twice,
; and scheduling keeps going if the web server is down.
[program:sitevaulta-scheduler]
process_name=%(program_name)s
command=/usr/bin/php /home/Project/website-backup/artisan schedule:work
directory=/home/Project/website-backup
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=milton
numprocs=1
redirect_stderr=true
stdout_logfile=/home/Project/website-backup/storage/logs/supervisor-scheduler.log
stdout_logfile_maxbytes=5MB
