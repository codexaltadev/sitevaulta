[program:sitevaulta-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/Project/website-backup/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=7200
directory=/home/Project/website-backup
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=milton
numprocs=2
redirect_stderr=true
stdout_logfile=/home/Project/website-backup/storage/logs/supervisor-queue-worker.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=3600

[program:sitevaulta-scheduler]
process_name=%(program_name)s
command=/usr/bin/php /home/Project/website-backup/artisan schedule:work
directory=/home/Project/website-backup
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=milton
numprocs=1
redirect_stderr=true
stdout_logfile=/home/Project/website-backup/storage/logs/supervisor-scheduler.log
stdout_logfile_maxbytes=5MB


; Uptime checks run on their own queue so long backup jobs never delay them.
; Raise numprocs as the number of monitors grows (each worker runs one check at a time).
[program:sitevaulta-monitor-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/Project/website-backup/artisan queue:work --queue=monitoring --sleep=1 --max-time=3600 --timeout=400
directory=/home/Project/website-backup
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=milton
numprocs=4
redirect_stderr=true
stdout_logfile=/home/Project/website-backup/storage/logs/supervisor-monitor-worker.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=420
